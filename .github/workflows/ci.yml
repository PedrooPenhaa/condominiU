name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5432"
      TEST_PG_OWNER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y postgresql-client
      - run: npm install
      # Os tipos do React ainda não foram conferidos em uma instalação completa.
      - run: npm run typecheck
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          BUILD_VERCEL: "1"
